name: 发布到 GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持手动触发
    inputs:
      version:
        description: '要发布的版本号 (例如: 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: 解析版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            PROJECT_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            PROJECT_VERSION=${GITHUB_REF_NAME#v}
          else
            PROJECT_VERSION="1.0.0"
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV
          echo "Resolved Version: $PROJECT_VERSION"
      
      - name: 更新 POM 版本
        run: |
          mvn versions:set -DnewVersion=${{ env.PROJECT_VERSION }} -DgenerateBackupPoms=false
      
      - name: 发布到 GitHub Packages
        run: mvn -B clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
