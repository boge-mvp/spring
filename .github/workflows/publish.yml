name: 发布到 GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支持手动触发
    inputs:
      version:
        description: '要发布的版本号 (例如: 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Maven 本地仓库（补充）
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 配置 Maven 认证
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            PROJECT_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            PROJECT_VERSION=${GITHUB_REF_NAME#v}
          else
            PROJECT_VERSION="1.0.0"
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV
          echo "Resolved Version: $PROJECT_VERSION"
      
      - name: 更新 POM 版本
        run: |
          mvn versions:set -DnewVersion=${{ env.PROJECT_VERSION }} -DgenerateBackupPoms=false
      
      - name: 发布到 GitHub Packages
        run: |
          # 彻底清理，避免 Kotlin 编译缓存问题
          mvn clean
          rm -rf target
          
          # 激活父 POM 中的 XKotlin profile（包含 kapt 配置）
          # XKotlin profile 已设置 activeByDefault=true，但显式激活更可靠
          mvn -B deploy -P XJava,XSpringBootMysql,XSpringBootRedis,XRetrofit,XSpringBoot,XPlugSourcesBuild,XOKHttp,XKotlin,XShedlockSpringRedis -DskipTests -e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
