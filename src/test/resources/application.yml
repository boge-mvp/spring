spring:
  # 运行环境 dev:开发环境|test:测试环境|prod:生产环境
  profiles:
    active: test
  main:
    allow-bean-definition-overriding: true
  # jackson
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      lettuce:
        pool:
          max-idle: 2
      password: abcd1234


config:
  redis:
    keyPrefix: test
    enabled-cache: true
  http:
    api-base-url: https://www.onebet.cm/gameRes/game-release/games/
    virtual-thread: true


